<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#f2f3f5">

    <title>Flash Cards</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


    <!-- ========================= -->
    <!-- ГЛАВНЫЙ ЭКРАН -->
    <!-- ========================= -->

    <section id="homeScreen" class="screen">

        <header>

            <div class="title">
                Flash Cards
            </div>

        </header>


        <div class="section-title">
            Мои колоды
        </div>


        <div id="decksList"></div>


        <button
            id="createDeckButton"
            class="primary-button"
        >
            ＋ Создать колоду
        </button>

    </section>



    <!-- ========================= -->
    <!-- СОЗДАНИЕ КОЛОДЫ -->
    <!-- ========================= -->

    <section
        id="createScreen"
        class="screen hidden"
    >

        <div class="screen-header">

            <button
                id="backToHomeButton"
                class="back-button"
            >
                ←
            </button>

            <div class="screen-title">
                Новая колода
            </div>

        </div>


        <div class="field">

            <label>
                Название колоды
            </label>

            <input
                id="deckName"
                type="text"
                maxlength="60"
                placeholder="Например: Английский для работы"
            >

        </div>


        <div class="section-title small">
            Карточки
        </div>


        <div id="newCardsList"></div>


        <button
            id="addCardButton"
            class="secondary-button"
        >
            ＋ Добавить карточку
        </button>


        <button
            id="saveDeckButton"
            class="primary-button"
        >
            Сохранить колоду
        </button>

    </section>



    <!-- ========================= -->
    <!-- ПРОСМОТР КОЛОДЫ -->
    <!-- ========================= -->

    <section
        id="deckScreen"
        class="screen hidden"
    >

        <div class="screen-header">

            <button
                id="deckBackButton"
                class="back-button"
            >
                ←
            </button>

            <div
                id="deckTitle"
                class="screen-title"
            >
                Колода
            </div>

        </div>


        <div
            id="deckCardsList"
            class="deck-cards-list"
        ></div>


        <button
            id="startDeckButton"
            class="primary-button"
        >
            ▶ Учить колоду
        </button>


        <button
            id="deleteDeckButton"
            class="secondary-button danger"
        >
            Удалить колоду
        </button>

    </section>



    <!-- ========================= -->
    <!-- ОБУЧЕНИЕ -->
    <!-- ========================= -->

    <section
        id="studyScreen"
        class="screen hidden"
    >

        <header>

            <div class="title">
                <span id="studyDeckName">
                    Flash Cards
                </span>
            </div>

            <div
                id="progress"
                class="progress"
            >
                1 / 1
            </div>

        </header>


        <div class="card-container">

            <div
                id="card"
                class="card"
            >


                <!-- ЛИЦЕВАЯ СТОРОНА -->

                <div class="card-side card-front">

                    <img
                        id="cardImage"
                        src=""
                        alt=""
                    >

                    <div class="card-content">

                        <div class="label">
                            Фраза
                        </div>

                        <div
                            id="frontText"
                            class="phrase"
                        ></div>

                        <div class="hint">
                            Нажмите на карточку
                        </div>

                    </div>

                </div>


                <!-- ОБРАТНАЯ СТОРОНА -->

                <div class="card-side card-back">

                    <img
                        id="cardImageBack"
                        src=""
                        alt=""
                    >

                    <div class="card-content">

                        <div class="label">
                            Перевод
                        </div>

                        <div
                            id="backText"
                            class="phrase"
                        ></div>

                    </div>

                </div>

            </div>

        </div>


        <div class="buttons">

            <button
                id="dontKnowButton"
                class="btn no"
            >
                ✕ Не знаю
            </button>


            <button
                id="knowButton"
                class="btn yes"
            >
                ✓ Знаю
            </button>

        </div>


        <button
            id="nextButton"
            class="next"
        >
            Следующая →
        </button>

    </section>


</div>


<script src="app.js"></script>

</body>

</html>
