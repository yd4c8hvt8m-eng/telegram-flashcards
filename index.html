<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#f2f3f5"
    >

    <title>Flash Cards</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- ================================= -->
    <!-- ГЛАВНЫЙ ЭКРАН -->
    <!-- ================================= -->

    <section
        id="homeScreen"
        class="screen"
    >

        <header>

            <div class="title">
                Flash Cards
            </div>

        </header>


        <div class="section-title">
            Мои колоды
        </div>


        <div id="decksList"></div>


        <button
            id="createDeckButton"
            class="primary-button"
        >
            ＋ Создать колоду
        </button>

    </section>



    <!-- ================================= -->
    <!-- СОЗДАНИЕ КОЛОДЫ -->
    <!-- ================================= -->

    <section
        id="createScreen"
        class="screen hidden"
    >

        <div class="screen-header">

            <button
                id="backToHomeButton"
                class="back-button"
            >
                ←
            </button>


            <div class="screen-title">
                Новая колода
            </div>

        </div>


        <!-- НАЗВАНИЕ -->

        <div class="field">

            <label>
                Название колоды
            </label>


            <input
                id="deckName"
                type="text"
                maxlength="60"
                placeholder="Например: История Казахстана"
            >

        </div>


        <!-- ЭМОДЗИ КОЛОДЫ -->

        <div class="field">

            <label>
                Иконка колоды
            </label>


            <div class="emoji-row">

                <button
                    type="button"
                    class="emoji-choice selected"
                    data-emoji="📚"
                >
                    📚
                </button>


                <button
                    type="button"
                    class="emoji-choice"
                    data-emoji="🧠"
                >
                    🧠
                </button>


                <button
                    type="button"
                    class="emoji-choice"
                    data-emoji="💼"
                >
                    💼
                </button>


                <button
                    type="button"
                    class="emoji-choice"
                    data-emoji="📊"
                >
                    📊
                </button>


                <button
                    type="button"
                    class="emoji-choice"
                    data-emoji="🐟"
                >
                    🐟
                </button>


                <button
                    type="button"
                    class="emoji-choice"
                    data-emoji="🚗"
                >
                    🚗
                </button>


                <button
                    type="button"
                    class="emoji-choice"
                    data-emoji="⚙️"
                >
                    ⚙️
                </button>


                <button
                    type="button"
                    class="emoji-choice"
                    data-emoji="⭐"
                >
                    ⭐
                </button>

            </div>

        </div>


        <div class="section-title small">
            Карточки
        </div>


        <div id="newCardsList"></div>


        <button
            id="addCardButton"
            class="secondary-button"
        >
            ＋ Добавить карточку
        </button>


        <button
            id="saveDeckButton"
            class="primary-button"
        >
            Сохранить колоду
        </button>

    </section>



    <!-- ================================= -->
    <!-- ПРОСМОТР КОЛОДЫ -->
    <!-- ================================= -->

    <section
        id="deckScreen"
        class="screen hidden"
    >

        <div class="screen-header">

            <button
                id="deckBackButton"
                class="back-button"
            >
                ←
            </button>


            <div
                id="deckIcon"
                class="deck-header-icon"
            >
                📚
            </div>


            <div
                id="deckTitle"
                class="screen-title"
            >
                Колода
            </div>

        </div>


        <!-- УЧИТЬ -->

        <button
            id="startDeckButton"
            class="primary-button"
        >
            ▶ Учить колоду
        </button>


        <!-- СОДЕРЖАНИЕ -->

        <button
            id="contentButton"
            class="secondary-button"
        >
            ☰ Содержание колоды
        </button>


        <div
            id="deckCardsContainer"
            class="hidden"
        >

            <div
                id="deckCardsList"
                class="deck-cards-list"
            ></div>

        </div>


        <!-- УДАЛИТЬ -->

        <button
            id="deleteDeckButton"
            class="secondary-button danger"
        >
            Удалить колоду
        </button>

    </section>



    <!-- ================================= -->
    <!-- ОБУЧЕНИЕ -->
    <!-- ================================= -->

    <section
        id="studyScreen"
        class="screen hidden"
    >

        <header>

            <div class="study-header">

                <div
                    id="studyDeckIcon"
                    class="study-icon"
                >
                    📚
                </div>


                <div
                    id="studyDeckName"
                    class="title"
                >
                    Flash Cards
                </div>

            </div>


            <div
                id="progress"
                class="progress"
            >
                1 / 1
            </div>

        </header>


        <!-- КАРТОЧКА -->

        <div class="card-container">

            <div
                id="card"
                class="card"
            >


                <!-- ЛИЦЕВАЯ -->

                <div
                    class="card-side card-front"
                >

                    <div
                        id="cardEmoji"
                        class="card-emoji"
                    >
                        📚
                    </div>


                    <div class="card-content">

                        <div class="label">
                            Лицевая сторона
                        </div>


                        <div
                            id="frontText"
                            class="phrase"
                        ></div>


                        <div class="hint">
                            Нажмите на карточку
                        </div>

                    </div>

                </div>



                <!-- ОБРАТНАЯ -->

                <div
                    class="card-side card-back"
                >

                    <div
                        id="cardEmojiBack"
                        class="card-emoji"
                    >
                        📚
                    </div>


                    <div class="card-content">

                        <div class="label">
                            Обратная сторона
                        </div>


                        <div
                            id="backText"
                            class="phrase"
                        ></div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ОТВЕТ -->

        <div class="buttons">

            <button
                id="dontKnowButton"
                class="btn no"
            >
                ✕ Не знаю
            </button>


            <button
                id="knowButton"
                class="btn yes"
            >
                ✓ Знаю
            </button>

        </div>


        <button
            id="nextButton"
            class="next"
        >
            Следующая →
        </button>

    </section>



    <!-- ================================= -->
    <!-- УВЕДОМЛЕНИЕ -->
    <!-- ================================= -->

    <div
        id="toast"
        class="toast"
    >

        <div
            id="toastIcon"
            class="toast-icon"
        >
            ✓
        </div>


        <div
            id="toastText"
            class="toast-text"
        >
            Готово
        </div>

    </div>



    <!-- ================================= -->
    <!-- ПОДТВЕРЖДЕНИЕ УДАЛЕНИЯ -->
    <!-- ================================= -->

    <div
        id="confirmOverlay"
        class="overlay hidden"
    >

        <div class="confirm-box">

            <div class="confirm-title">
                Удалить колоду?
            </div>


            <div class="confirm-text">
                Все карточки этой колоды
                будут удалены.
            </div>


            <div class="confirm-buttons">

                <button
                    id="cancelDeleteButton"
                    class="secondary-button"
                >
                    Отмена
                </button>


                <button
                    id="confirmDeleteButton"
                    class="delete-confirm-button"
                >
                    Удалить
                </button>

            </div>

        </div>

    </div>


</div>


<script src="app.js"></script>

</body>

</html>
