<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Flash Cards</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ==================== ГЛАВНАЯ ==================== -->

    <section id="homeScreen" class="screen active">

        <div class="top-header">

            <div>
                <div class="app-title">
                    Flash Cards
                </div>

                <div class="app-subtitle">
                    Учись чему угодно
                </div>
            </div>

        </div>


        <div class="section-title">
            Мои колоды
        </div>


        <div id="decksList" class="decks-list"></div>


        <button
            id="createDeckBtn"
            class="primary-btn"
        >
            ＋ Создать колоду
        </button>


        <div class="app-version">
            Версия <span class="app-version-number"></span>
        </div>

    </section>


    <!-- ==================== СОЗДАНИЕ / РЕДАКТИРОВАНИЕ КОЛОДЫ ==================== -->

    <section id="createScreen" class="screen">

        <div class="screen-header">

            <button
                id="backFromCreate"
                class="back-btn"
            >
                ←
            </button>

            <h2 id="createScreenTitle">
                Новая колода
            </h2>

        </div>


        <div class="form-card">

            <label>
                Название колоды
            </label>

            <input
                id="deckNameInput"
                type="text"
                placeholder="Например: Английский язык"
            >


            <label>
                Значок колоды
            </label>

            <div
                id="deckIconSelector"
                class="emoji-selector"
            >

                <button
                    class="emoji-option selected"
                    data-icon="📚"
                    type="button"
                >
                    📚
                </button>

                <button
                    class="emoji-option"
                    data-icon="🧠"
                    type="button"
                >
                    🧠
                </button>

                <button
                    class="emoji-option"
                    data-icon="💼"
                    type="button"
                >
                    💼
                </button>

                <button
                    class="emoji-option"
                    data-icon="📊"
                    type="button"
                >
                    📊
                </button>

                <button
                    class="emoji-option"
                    data-icon="🐟"
                    type="button"
                >
                    🐟
                </button>

                <button
                    class="emoji-option"
                    data-icon="🚗"
                    type="button"
                >
                    🚗
                </button>

                <button
                    class="emoji-option"
                    data-icon="⚙️"
                    type="button"
                >
                    ⚙️
                </button>

                <button
                    class="emoji-option"
                    data-icon="⭐"
                    type="button"
                >
                    ⭐
                </button>

            </div>

        </div>


        <div class="section-title">
            Карточки
        </div>


        <div id="newCardsList"></div>


        <button
            id="addCardBtn"
            class="secondary-btn"
        >
            ＋ Добавить карточку
        </button>


        <button
            id="saveDeckBtn"
            class="primary-btn"
        >
            Сохранить колоду
        </button>


        <div class="app-version">
            Версия <span class="app-version-number"></span>
        </div>

    </section>


    <!-- ==================== КОЛОДА ==================== -->

    <section id="deckScreen" class="screen">

        <div class="screen-header">

            <button
                id="backFromDeck"
                class="back-btn"
            >
                ←
            </button>


            <div class="deck-heading">

                <div
                    id="deckIcon"
                    class="deck-heading-icon"
                >
                    📚
                </div>


                <div>

                    <h2 id="deckTitle">
                        Колода
                    </h2>

                    <div
                        id="deckCount"
                        class="small-text"
                    >
                        0 карточек
                    </div>

                </div>

            </div>

        </div>


        <button
            id="startStudyBtn"
            class="primary-btn study-main-btn"
        >
            ▶ Учить колоду
        </button>


        <button
            id="toggleContentBtn"
            class="secondary-btn"
        >
            ☰ Содержание колоды
        </button>


        <button
            id="editDeckBtn"
            class="secondary-btn"
        >
            ✏️ Редактировать колоду
        </button>


        <div
            id="contentContainer"
            class="content-container hidden"
        >
        </div>


        <button
            id="deleteDeckBtn"
            class="danger-btn"
        >
            🗑 Удалить колоду
        </button>


        <div class="app-version">
            Версия <span class="app-version-number"></span>
        </div>

    </section>


    <!-- ==================== ОБУЧЕНИЕ ==================== -->

    <section id="studyScreen" class="screen">

        <div class="screen-header">

            <button
                id="backFromStudy"
                class="back-btn"
            >
                ←
            </button>


            <div class="study-heading">

                <span id="studyDeckIcon">
                    📚
                </span>

                <span id="studyDeckName">
                    Колода
                </span>

            </div>

        </div>


        <div class="progress-container">

            <div class="progress-text">
                <span id="progressText">
                    1 / 1
                </span>
            </div>


            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </div>


        <div
            id="flashcard"
            class="flashcard"
        >

            <div class="flashcard-inner">


                <!-- ЛИЦЕВАЯ СТОРОНА -->

                <div class="flashcard-face flashcard-front">

                    <div class="side-label">
                        Лицевая сторона
                    </div>


                    <div class="study-image-box">

                        <img
                            id="studyImage"
                            class="study-image"
                            alt=""
                        >

                        <div
                            id="studyImagePlaceholder"
                            class="study-image-placeholder"
                        >
                            📷
                        </div>

                    </div>


                    <div
                        id="studyFront"
                        class="card-text"
                    >
                    </div>

                </div>


                <!-- ОБРАТНАЯ СТОРОНА -->

                <div class="flashcard-face flashcard-back">

                    <div class="side-label">
                        Обратная сторона
                    </div>


                    <div class="study-image-box">

                        <img
                            id="studyImageBack"
                            class="study-image"
                            alt=""
                        >

                        <div
                            id="studyImageBackPlaceholder"
                            class="study-image-placeholder"
                        >
                            📷
                        </div>

                    </div>


                    <div
                        id="studyBack"
                        class="card-text"
                    >
                    </div>

                </div>

            </div>

        </div>


        <div class="hint">
            Нажми на карточку, чтобы перевернуть
        </div>


        <div class="study-buttons">

            <button
                id="dontKnowBtn"
                class="study-btn dont-know"
            >
                Не знаю
            </button>


            <button
                id="knowBtn"
                class="study-btn know"
            >
                Знаю
            </button>

        </div>


        <button
            id="nextBtn"
            class="secondary-btn next-btn"
        >
            Следующая
        </button>


        <div class="app-version">
            Версия <span class="app-version-number"></span>
        </div>

    </section>


    <!-- ==================== УВЕДОМЛЕНИЕ ==================== -->

    <div
        id="toast"
        class="toast"
    >
    </div>


    <!-- ==================== ПОДТВЕРЖДЕНИЕ УДАЛЕНИЯ ==================== -->

    <div
        id="confirmOverlay"
        class="confirm-overlay hidden"
    >

        <div class="confirm-box">

            <div class="confirm-icon">
                🗑
            </div>


            <h3>
                Удалить колоду?
            </h3>


            <p>
                Колода и её карточки будут удалены.
            </p>


            <div class="confirm-buttons">

                <button
                    id="cancelDeleteBtn"
                    class="secondary-btn"
                >
                    Отмена
                </button>


                <button
                    id="confirmDeleteBtn"
                    class="danger-btn"
                >
                    Удалить
                </button>

            </div>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
